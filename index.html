<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Quest - 2D Platformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        canvas {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            background: linear-gradient(to bottom, #090d16, #111827);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden p-2 text-white">

    <!-- Game Header / HUD -->
    <div class="w-full max-w-4xl flex justify-between items-center bg-slate-800/80 backdrop-blur border border-slate-700 rounded-xl px-4 py-2 mb-2">
        <div class="flex items-center space-x-6 font-orbitron">
            <div class="flex items-center space-x-2">
                <span class="text-slate-400 text-xs uppercase tracking-wider">Уровень:</span>
                <span id="ui-level" class="text-xl font-bold text-cyan-400">1</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-slate-400 text-xs uppercase tracking-wider">Звёзды:</span>
                <span id="ui-stars" class="text-xl font-bold text-yellow-400">0 / 0</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-slate-400 text-xs uppercase tracking-wider">Жизни:</span>
                <div id="ui-lives" class="flex space-x-1 text-red-500 text-lg">❤️❤️❤️</div>
            </div>
        </div>
        <button id="btn-sound" class="text-slate-400 hover:text-white transition p-2 rounded-lg bg-slate-700/50">
            🔊 Звук
        </button>
    </div>

    <!-- Game Container & Canvas -->
    <div class="relative w-full max-w-4xl aspect-[16/9] flex items-center justify-center">
        <canvas id="gameCanvas" class="w-full h-full rounded-2xl border border-slate-700/80"></canvas>

        <!-- Overlay Screens -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center rounded-2xl p-6 text-center z-10 transition-opacity duration-300">
            <h1 id="overlay-title" class="font-orbitron text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 mb-6 tracking-wider">NEON QUEST</h1>
            <button id="btn-start" class="font-orbitron px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold rounded-xl text-lg shadow-lg shadow-cyan-500/30 transform hover:-translate-y-0.5 transition active:translate-y-0">
                НАЧАТЬ ИГРУ
            </button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="w-full max-w-4xl flex justify-between items-center mt-3 px-2 sm:hidden">
        <div class="flex space-x-3">
            <button id="btn-left" class="w-14 h-14 bg-slate-800 border border-slate-700 rounded-2xl active:bg-cyan-600 flex items-center justify-center text-2xl select-none">◀</button>
            <button id="btn-right" class="w-14 h-14 bg-slate-800 border border-slate-700 rounded-2xl active:bg-cyan-600 flex items-center justify-center text-2xl select-none">▶</button>
        </div>
        <button id="btn-jump" class="w-20 h-14 bg-gradient-to-r from-cyan-500 to-blue-600 border border-cyan-400 rounded-2xl active:opacity-80 flex items-center justify-center text-xl font-bold font-orbitron select-none text-slate-950">ПРЫЖОК</button>
    </div>

    <script>
        // --- Web Audio Synthesizer ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol=0.1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            jump() { this.playTone(350, 'sine', 0.15, 0.15); }
            coin() { 
                this.playTone(800, 'triangle', 0.1, 0.1); 
                setTimeout(() => this.playTone(1200, 'triangle', 0.15, 0.1), 60);
            }
            hit() { this.playTone(120, 'sawtooth', 0.25, 0.2); }
            win() { 
                this.playTone(400, 'sine', 0.1, 0.1);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.1), 100);
                setTimeout(() => this.playTone(800, 'sine', 0.2, 0.1), 200);
            }
        }
        const sfx = new SoundFX();

        // --- Canvas Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 450;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // --- UI Elements ---
        const uiLevel = document.getElementById('ui-level');
        const uiStars = document.getElementById('ui-stars');
        const uiLives = document.getElementById('ui-lives');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const btnStart = document.getElementById('btn-start');
        const btnSound = document.getElementById('btn-sound');

        btnSound.addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            btnSound.textContent = sfx.enabled ? "🔊 Звук" : "🔇 Мут";
        });

        // --- Inputs ---
        const keys = { left: false, right: false, up: false };

        window.addEventListener('keydown', e => {
            sfx.init();
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
        });

        // Touch Control Listeners
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'up');

        // --- Game State ---
        let gameState = 'START';
        let currentLevelIndex = 0;
        let lives = 3;
        let collectedStars = 0;
        let totalStarsInLevel = 0;

        // --- Game Objects ---
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 24;
                this.height = 32;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4.5;
                this.jumpPower = -9.8;
                this.gravity = 0.45;
                this.isGrounded = false;
                this.facing = 'right';
            }

            reset(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.isGrounded = false;
            }

            update(platforms) {
                if (keys.left) {
                    this.vx = -this.speed;
                    this.facing = 'left';
                } else if (keys.right) {
                    this.vx = this.speed;
                    this.facing = 'right';
                } else {
                    this.vx *= 0.7;
                }

                if (keys.up && this.isGrounded) {
                    this.vy = this.jumpPower;
                    this.isGrounded = false;
                    sfx.jump();
                }

                this.vy += this.gravity;

                this.x += this.vx;
                this.checkCollisionsX(platforms);

                this.y += this.vy;
                this.isGrounded = false;
                this.checkCollisionsY(platforms);

                if (this.x < 0) this.x = 0;
                if (this.x + this.width > CANVAS_WIDTH) this.x = CANVAS_WIDTH - this.width;
            }

            checkCollisionsX(platforms) {
                for (let p of platforms) {
                    if (this.intersects(p)) {
                        if (this.vx > 0) this.x = p.x - this.width;
                        else if (this.vx < 0) this.x = p.x + p.w;
                        this.vx = 0;
                    }
                }
            }

            checkCollisionsY(platforms) {
                for (let p of platforms) {
                    if (this.intersects(p)) {
                        if (this.vy > 0) {
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.isGrounded = true;
                            if (p.vx) this.x += p.vx;
                        } else if (this.vy < 0) {
                            this.y = p.y + p.h;
                            this.vy = 0;
                        }
                    }
                }
            }

            intersects(rect) {
                return this.x < rect.x + rect.w &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.h &&
                       this.y + this.height > rect.y;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#22d3ee';
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();

                ctx.fillStyle = '#0f172a';
                const visorX = this.facing === 'right' ? this.x + 12 : this.x + 4;
                ctx.fillRect(visorX, this.y + 6, 8, 6);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(this.facing === 'right' ? visorX + 4 : visorX, this.y + 7, 3, 4);

                ctx.restore();
            }
        }

        // --- Level Data ---
        const levels = [
            {
                spawn: { x: 50, y: 350 },
                portal: { x: 720, y: 120 },
                platforms: [
                    { x: 0, y: 400, w: 800, h: 50 },
                    { x: 150, y: 320, w: 120, h: 18 },
                    { x: 330, y: 260, w: 140, h: 18 },
                    { x: 520, y: 200, w: 120, h: 18 },
                    { x: 680, y: 160, w: 100, h: 18 },
                ],
                stars: [
                    { x: 200, y: 280 },
                    { x: 390, y: 220 },
                    { x: 570, y: 160 }
                ],
                spikes: [
                    { x: 300, y: 382, w: 60, h: 18 }
                ],
                enemies: []
            },
            {
                spawn: { x: 40, y: 350 },
                portal: { x: 720, y: 100 },
                platforms: [
                    { x: 0, y: 410, w: 200, h: 40 },
                    { x: 230, y: 320, w: 110, h: 18 },
                    { x: 380, y: 240, w: 110, h: 18 },
                    { x: 530, y: 170, w: 110, h: 18 },
                    { x: 670, y: 140, w: 110, h: 18 }
                ],
                stars: [
                    { x: 285, y: 280 },
                    { x: 435, y: 200 },
                    { x: 725, y: 100 }
                ],
                spikes: [
                    { x: 200, y: 410, w: 600, h: 40 }
                ],
                enemies: [] // Убран фиолетовый враг
            },
            {
                spawn: { x: 50, y: 100 },
                portal: { x: 720, y: 370 },
                platforms: [
                    { x: 30, y: 140, w: 100, h: 18 },
                    { x: 180, y: 180, w: 80, h: 18, vx: 2, minX: 160, maxX: 300 },
                    { x: 350, y: 220, w: 90, h: 18 },
                    { x: 490, y: 180, w: 80, h: 18, vx: -2, minX: 470, maxX: 620 },
                    { x: 660, y: 140, w: 100, h: 18 },
                    { x: 520, y: 320, w: 120, h: 18 },
                    { x: 300, y: 370, w: 100, h: 18 },
                    { x: 670, y: 410, w: 120, h: 40 },
                ],
                stars: [
                    { x: 220, y: 140 },
                    { x: 390, y: 180 },
                    { x: 700, y: 90 }
                ],
                spikes: [
                    { x: 0, y: 430, w: 670, h: 20 }
                ],
                enemies: [
                    { x: 360, y: 200, w: 20, h: 20, vx: 1.5, minX: 350, maxX: 420 },
                    { x: 530, y: 300, w: 20, h: 20, vx: 2, minX: 520, maxX: 620 }
                ]
            }
        ];

        let player = new Player(0, 0);
        let activePlatforms = [];
        let activeStars = [];
        let activeSpikes = [];
        let activeEnemies = [];
        let portal = { x: 0, y: 0, w: 36, h: 50, angle: 0 };

        function loadLevel(index) {
            currentLevelIndex = index;
            const lvl = levels[index];

            player.reset(lvl.spawn.x, lvl.spawn.y);

            activePlatforms = lvl.platforms.map(p => ({ ...p }));
            activeStars = lvl.stars.map(s => ({ ...s, collected: false, pulse: 0 }));
            collectedStars = 0;
            totalStarsInLevel = activeStars.length;

            activeSpikes = lvl.spikes.map(s => ({ ...s }));
            activeEnemies = lvl.enemies ? lvl.enemies.map(e => ({ ...e })) : [];

            portal.x = lvl.portal.x;
            portal.y = lvl.portal.y;

            updateUI();
        }

        function updateUI() {
            uiLevel.textContent = currentLevelIndex + 1;
            uiStars.textContent = `${collectedStars} / ${totalStarsInLevel}`;
            uiLives.textContent = '❤️'.repeat(Math.max(0, lives));
        }

        function triggerGameOver(win = false) {
            gameState = win ? 'WIN' : 'GAMEOVER';
            overlay.classList.remove('opacity-0', 'pointer-events-none');

            if (win) {
                sfx.win();
                overlayTitle.textContent = "ПОБЕДА!";
                overlayTitle.className = "font-orbitron text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 mb-6 tracking-wider";
                btnStart.textContent = "ИГРАТЬ СНОВА";
            } else {
                sfx.hit();
                overlayTitle.textContent = "ИГРА ОКОНЧАНА";
                overlayTitle.className = "font-orbitron text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-rose-700 mb-6 tracking-wider";
                btnStart.textContent = "ПОПРОБОВАТЬ СНОВА";
            }
        }

        function playerDie() {
            sfx.hit();
            lives--;
            updateUI();
            if (lives <= 0) {
                triggerGameOver(false);
            } else {
                const lvl = levels[currentLevelIndex];
                player.reset(lvl.spawn.x, lvl.spawn.y);
            }
        }

        function drawPlatforms() {
            activePlatforms.forEach(p => {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 4);
                ctx.fill();
                ctx.stroke();
            });
        }

        function drawSpikes() {
            activeSpikes.forEach(s => {
                ctx.fillStyle = '#ef4444';
                const count = Math.floor(s.w / 12);
                const step = s.w / count;

                ctx.beginPath();
                for (let i = 0; i < count; i++) {
                    ctx.moveTo(s.x + i * step, s.y + s.h);
                    ctx.lineTo(s.x + (i + 0.5) * step, s.y);
                    ctx.lineTo(s.x + (i + 1) * step, s.y + s.h);
                }
                ctx.closePath();
                ctx.fill();
            });
        }

        function drawStars() {
            activeStars.forEach(s => {
                if (s.collected) return;
                s.pulse += 0.05;
                const scale = 1 + Math.sin(s.pulse) * 0.15;

                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.scale(scale, scale);
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#facc15';
                
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 10,
                               -Math.sin((18 + i * 72) * Math.PI / 180) * 10);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 4,
                               -Math.sin((54 + i * 72) * Math.PI / 180) * 4);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });
        }

        function drawEnemies() {
            activeEnemies.forEach(e => {
                ctx.save();
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawPortal() {
            portal.angle += 0.03;
            const isReady = collectedStars >= totalStarsInLevel;

            ctx.save();
            ctx.translate(portal.x + portal.w / 2, portal.y + portal.h / 2);
            ctx.rotate(portal.angle);
            ctx.shadowColor = isReady ? '#22c55e' : '#64748b';
            ctx.shadowBlur = isReady ? 15 : 5;

            ctx.strokeStyle = isReady ? '#22c55e' : '#64748b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(0, 0, portal.w / 2, portal.h / 2, 0, 0, Math.PI * 2);
            ctx.stroke();

            if (isReady) {
                ctx.fillStyle = 'rgba(34, 197, 94, 0.3)';
                ctx.fill();
            }
            ctx.restore();
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            activePlatforms.forEach(p => {
                if (p.vx) {
                    p.x += p.vx;
                    if (p.x <= p.minX || p.x + p.w >= p.maxX) p.vx *= -1;
                }
            });

            activeEnemies.forEach(e => {
                if (e.vx) {
                    e.x += e.vx;
                    if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx *= -1;
                }

                if (player.intersects(e)) {
                    playerDie();
                }
            });

            player.update(activePlatforms);

            activeSpikes.forEach(s => {
                if (player.intersects(s)) {
                    playerDie();
                }
            });

            if (player.y > CANVAS_HEIGHT) {
                playerDie();
            }

            activeStars.forEach(s => {
                if (!s.collected) {
                    const dist = Math.hypot((player.x + player.width / 2) - s.x, (player.y + player.height / 2) - s.y);
                    if (dist < 20) {
                        s.collected = true;
                        collectedStars++;
                        sfx.coin();
                        updateUI();
                    }
                }
            });

            if (player.intersects(portal)) {
                if (collectedStars >= totalStarsInLevel) {
                    sfx.win();
                    if (currentLevelIndex + 1 < levels.length) {
                        loadLevel(currentLevelIndex + 1);
                    } else {
                        triggerGameOver(true);
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;
            for (let x = 0; x < CANVAS_WIDTH; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_WIDTH, y); ctx.stroke();
            }

            drawPlatforms();
            drawSpikes();
            drawPortal();
            drawStars();
            drawEnemies();
            player.draw(ctx);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        btnStart.addEventListener('click', () => {
            sfx.init();
            lives = 3;
            gameState = 'PLAYING';
            overlay.classList.add('opacity-0', 'pointer-events-none');
            loadLevel(0);
        });

        window.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
